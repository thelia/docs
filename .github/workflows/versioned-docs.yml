name: Versioned docs

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  released-only:
    name: Published versions describe released code only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a change to a published version without the released label
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASED: ${{ contains(github.event.pull_request.labels.*.name, 'released') }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD -- versioned_docs versioned_sidebars versions.json)
          if [ -z "$changed" ] || [ "$RELEASED" = "true" ]; then
            exit 0
          fi
          echo "::error::This pull request changes a published version of the documentation."
          echo "$changed"
          echo "A published version describes what a tagged release ships. Document unreleased work in docs/ (the Next version)."
          echo "If every change above describes a tagged release, add the 'released' label to the pull request."
          exit 1
